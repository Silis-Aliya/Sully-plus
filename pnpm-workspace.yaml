packages:
  - "."
  - "worker/*"

allowBuilds:
  # pdfjs 的可选服务端画布依赖；浏览器端提取文本不执行其构建脚本。
  canvas: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@rei-standard/amsg-client@2.9.0-next.7'
  - '@rei-standard/amsg-instant@0.10.1-next.2'
  - '@rei-standard/amsg-server@2.6.0-next.12'
  - '@rei-standard/amsg-shared@0.4.0-next.3'
  - '@rei-standard/amsg-sw@2.4.0-next.3'
